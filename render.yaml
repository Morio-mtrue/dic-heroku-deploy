# Render Blueprint for the blog application (free tier).
services:
  - type: web
    name: dic-heroku-deploy
    runtime: python
    plan: free
    region: oregon
    buildCommand: bash build.sh
    startCommand: gunicorn python_heroku_task.wsgi
    envVars:
      # Wired by Render from the existing free Postgres database.
      - key: DATABASE_URL
        fromDatabase:
          name: dic-heroku-deploy-db
          property: connectionString
      # Random value generated by Render on first deploy.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # settings.py treats an unset DJANGO_DEBUG as debug on (for local
      # development), so production has to turn it off explicitly.
      - key: DJANGO_DEBUG
        value: "False"
